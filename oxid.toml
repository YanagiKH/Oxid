[project]
name = "oxid"
version = "0.7.0"
entry = "src/main.ox"

[scripts]
run = "oxid run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doc = "oxid doc"
clean = "oxid clean"
bootstrap = "cargo run --quiet -- run tools/bootstrap.ox"
compile = "cargo run --quiet -- run tools/compile.ox"
frontend = "cargo run --quiet -- run tools/frontend.ox"
diagnose = "cargo run --quiet -- run tools/diagnose.ox"
lint = "cargo run --quiet -- run tools/lint.ox"
emit = "cargo run --quiet -- run tools/emit.ox"
module = "cargo run --quiet -- run tools/module.ox"
syntax = "cargo run --quiet -- run tools/syntax.ox"
interop = "cargo run --quiet -- run tools/interop.ox"
bridge = "cargo run --quiet -- run tools/bridge.ox"
self-host = "cargo run --quiet -- run tools/self_host.ox"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
java_interop = true
python_interop = true
