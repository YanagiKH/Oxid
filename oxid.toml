[project]
name = "oxid"
version = "0.9.0"
entry = "src/main.ox"

[scripts]
run = "oxid run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doc = "oxid doc"
clean = "oxid clean"
bootstrap = "oxid bootstrap"
compile = "oxid compile"
self-compile = "oxid self-compile"
frontend = "oxid frontend"
self-host = "oxid self-host"
diagnose = "oxid diagnose"
lint = "oxid lint"
emit = "oxid emit"
module = "oxid module"
syntax = "oxid syntax"
interop = "oxid interop"
bridge = "oxid bridge"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
java_interop = true
python_interop = true
go_interop = true
web = true
discord = true

