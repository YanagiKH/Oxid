[project]
name = "oxid"
version = "0.7.0"
entry = "src/main.ox"

[scripts]
run = "cargo run -- run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doc = "oxid doc"
clean = "oxid clean"
bootstrap = "cargo run -- run tools/bootstrap.ox"
compile = "cargo run -- run tools/compile.ox"
self-compile = "cargo run -- run tools/self_compile.ox"
frontend = "cargo run -- run tools/frontend_preview.ox"
self-host = "cargo run -- run tools/self_host.ox"
diagnose = "oxid diagnose"
lint = "oxid lint"
emit = "oxid emit"
module = "oxid module"
syntax = "oxid syntax"
interop = "oxid interop"
bridge = "oxid bridge"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
java_interop = true
python_interop = true