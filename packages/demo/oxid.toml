[project]
name = "demo"
version = "0.9.0"
entry = "src/main.ox"

[scripts]
run = "oxid run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doctor = "oxid doctor"
doc = "oxid doc"
clean = "oxid clean"
check = "oxid check src/main.ox"
bootstrap = "oxid run ../../tools/bootstrap.ox"
frontend = "oxid run ../../tools/frontend.ox"
diagnose = "oxid run ../../tools/diagnose.ox"
lint = "oxid run ../../tools/lint.ox"
emit = "oxid run ../../tools/emit.ox"
module = "oxid run ../../tools/module.ox"
syntax = "oxid run ../../tools/syntax.ox"
self-host = "oxid run ../../tools/self_host.ox"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
