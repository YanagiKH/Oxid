[project]
name = "demo"
version = "0.7.0"
entry = "src/main.ox"

[scripts]
run = "oxid run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doctor = "oxid doctor"
doc = "oxid doc"
clean = "oxid clean"
check = "oxid check src/main.ox"
bootstrap = "oxid run ../../tools/bootstrap.ox"
frontend = "oxid run ../../tools/frontend_preview.ox"
diagnose = "oxid run ../../tools/diagnose.ox"
modules = "oxid run ../../tools/modules_preview.ox"
syntax = "oxid run ../../tools/syntax_preview.ox"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
