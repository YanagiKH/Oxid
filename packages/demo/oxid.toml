[project]
name = "demo"
version = "0.1.0"
entry = "src/main.ox"

[scripts]
run = "oxid run src/main.ox"
test = "oxid test"
fmt = "oxid fmt"
doc = "oxid doc"
doctor = "oxid doctor"
clean = "oxid clean"

[dependencies]

[build]
mode = "script-first"
incremental = true
ffi = true

[features]
async = true
macros = true
const_eval = true
c_interop = true
cpp_interop = true
