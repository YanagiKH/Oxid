name: Release standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  readiness:
    name: Verify release version and technical readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report technical release readiness
        run: python3 -B scripts/check_release_gates.py
      - name: Enforce tagged release readiness
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B scripts/check_release_gates.py --release-tag "$RELEASE_TAG"

  verify:
    needs: readiness
    uses: ./.github/workflows/ci.yml

  package:
    name: Package ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/oxid
            asset: oxid-linux-x86_64.tar.gz
          - os: windows-latest
            binary: target/release/oxid.exe
            asset: oxid-windows-x86_64.zip
          - os: macos-15-intel
            binary: target/release/oxid
            asset: oxid-macos-x86_64.tar.gz
          - os: macos-14
            binary: target/release/oxid
            asset: oxid-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Build optimized runtime
        run: cargo build --release --locked

      - name: Generate and verify compiler-demo round-trip artifacts
        run: cargo run --release --locked -- bootstrap

      - name: Package runtime and checksum
        run: python scripts/package_release.py "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Classify the validated release tag
        id: release_kind
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$version_without_metadata" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: oxid-*
          path: dist
          merge-multiple: true

      - name: Publish checksummed standalone binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release_kind.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
