  macos-native:
    name: Current macOS native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LLVM 19 and the Mach-O linker
        shell: bash
        run: |
          set -euo pipefail
          # This revision contains 19.1.7 bottles for both Intel and Apple Silicon.
          # Current formula revisions may omit the Intel bottle.
          core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          mkdir -p "$(dirname "$core")"
          core_workspace="$(mktemp -d "$(dirname "$core")/.oxid-llvm19.XXXXXX")"
          pinned_core="$core_workspace/pinned"
          saved_core="$core_workspace/original"
          revision=6a00b97b93bfc245d7083e4a90c7459ff5325222
          git init "$pinned_core"
          git -C "$pinned_core" remote add origin https://github.com/Homebrew/homebrew-core.git
          git -C "$pinned_core" fetch --filter=blob:none --depth=1 origin "$revision"
          test "$(git -C "$pinned_core" rev-parse FETCH_HEAD)" = "$revision"
          git -C "$pinned_core" checkout --detach FETCH_HEAD
          # Current Homebrew rejects this obsolete update-bot metadata. Keep
          # every source, bottle, dependency and build byte unchanged.
          python3 - "$pinned_core" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import sys

          formula_tree = "072eb5593e65cd9374940a2a183e18b656f57543"
          formula_file_count = 7674
          formula_inventory_sha = "d54485054853a163d3b5835b3403131eece818c7509fae4a570a7a35861e35b3"
          adaptation_file_count = 1156
          adaptation_inventory_sha = "df40f1369bb73ae9e9f489877dbd9137558d12f3048af29945cd91bdb304252a"
          formulas = {
              "llvm@19.rb": ("14c7ae5879dff4c4d3fab077671d924a56605c24e2fef252ca343d49029efa59",
                             "9672f3b5b565b7b5e310bd0aa4698540712ff5b74955d1716b8127825517eb95"),
              "lld@19.rb": ("bda99a28eec9b9e4986220751dd0c622566619d5071b9df9dcb3f315a92358a1",
                            "5fa2731e9bf2027ecb569817b3934cfb07e2684f7d41bd0e3310eda0de3d84fe"),
          }
          metadata_stanzas = {
              b'  no_autobump! because: :requires_manual_review\n': 1125,
              b'  no_autobump! because: :incompatible_version_format\n': 17,
              b'  no_autobump! because: :bumped_by_upstream\n': 10,
              b'  no_autobump! because: "some resources have to be updated manually"\n': 1,
              b'  no_autobump! because: "unable to get versions"\n': 1,
              b'  no_autobump! because: "resources cannot be updated automatically"\n': 1,
              b'  no_autobump! because: "\'playwright\' resource lacks PyPI sdist"\n': 1,
          }
          # These calls are inside deferred strategy bodies, not class metadata.
          # Keep their complete bodies and return values unchanged.
          nested_livechecks = (
              "Formula/b/bash.rb", "Formula/b/blastem.rb", "Formula/c/calabash.rb",
              "Formula/f/frege.rb", "Formula/h/http_load.rb",
          )
          nested_stanza = b"      no_autobump! because: :requires_manual_review\n"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def digest(body):
              return hashlib.sha256(body).hexdigest()

          def encoded(value):
              return json.dumps(value, ensure_ascii=True, separators=(",", ":")).encode() + b"\n"

          root = Path(sys.argv[1])
          command = ["git", "-C", str(root)]
          actual_tree = subprocess.check_output(command + ["rev-parse", "HEAD:Formula"]).decode().strip()
          require(actual_tree == formula_tree, "changed pinned Formula tree")
          entries = subprocess.check_output(command + ["ls-tree", "-rlz", "HEAD", "--", "Formula"])
          rows, prepared, changes, actual_names, nested_seen = [], [], [], set(), set()
          counts = dict.fromkeys(metadata_stanzas, 0)
          for entry in entries.split(b"\0"):
              if not entry:
                  continue
              details, path_bytes = entry.split(b"\t", 1)
              mode, kind, object_id, length = details.split()
              name = path_bytes.decode()
              relative = PurePosixPath(name)
              require(not relative.is_absolute() and relative.parts[0] == "Formula"
                      and ".." not in relative.parts and name.endswith(".rb")
                      and kind == b"blob" and mode in (b"100644", b"100755")
                      and name not in actual_names, "invalid pinned formula member")
              path = root / name
              before_stat = path.lstat()
              require(stat.S_ISREG(before_stat.st_mode) and before_stat.st_nlink == 1
                      and bool(before_stat.st_mode & 0o111) == (mode == b"100755"),
                      "nonregular or changed-mode pinned formula: " + name)
              before = path.read_bytes()
              fields = ("st_dev", "st_ino", "st_mode", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns")
              require(all(getattr(before_stat, field) == getattr(path.lstat(), field) for field in fields),
                      "pinned formula changed during read: " + name)
              blob = b"blob " + str(len(before)).encode() + b"\0" + before
              require(len(before) == int(length)
                      and hashlib.sha1(blob, usedforsecurity=False).hexdigest().encode() == object_id,
                      "changed pinned formula: " + name)
              actual_names.add(name)
              rows.append([name, mode.decode(), object_id.decode(), len(before)])
              found = [line for line in before.splitlines(keepends=True) if b"no_autobump!" in line]
              require(len(found) <= 1, "repeated formula update metadata: " + name)
              after = before
              if found:
                  stanza = found[0]
                  if name in nested_livechecks:
                      require(stanza == nested_stanza, "changed nested livecheck: " + name)
                      nested_seen.add(name)
                  else:
                      require(stanza in metadata_stanzas, "unknown formula update metadata: " + name)
                      counts[stanza] += 1
                      position = before.index(stanza)
                      after = b"".join(line for line in before.splitlines(keepends=True) if line != stanza)
                      require(after[:position] + stanza + after[position:] == before,
                              "invalid formula metadata inverse: " + name)
                      changes.append([name, mode.decode(), object_id.decode(), len(before), digest(before),
                                      len(after), digest(after), digest(stanza)])
                      prepared.append((path, after, before_stat.st_mode))
              if relative.name in formulas and name == "Formula/l/" + relative.name:
                  require((digest(before), digest(after)) == formulas[relative.name],
                          "invalid target formula adaptation: " + name)
          require(len(rows) == formula_file_count and digest(encoded(rows)) == formula_inventory_sha,
                  "changed pinned formula inventory")
          require(counts == metadata_stanzas and nested_seen == set(nested_livechecks)
                  and len(changes) == adaptation_file_count
                  and digest(encoded(changes)) == adaptation_inventory_sha,
                  "changed formula adaptation inventory")
          actual = set()
          for directory, directories, files in os.walk(root / "Formula", followlinks=False):
              require(all(not (Path(directory) / name).is_symlink() for name in directories),
                      "symlink pinned formula directory")
              actual.update((Path(directory) / name).relative_to(root).as_posix() for name in files)
          require(actual == actual_names, "untracked or missing pinned formula member")
          for path, body, mode in prepared:
              path.write_bytes(body)
              require(path.read_bytes() == body and path.stat().st_mode == mode,
                      "formula metadata write differed: " + str(path))
          report = {"formula_tree": formula_tree, "formula_files": len(rows),
                    "formula_inventory_sha256": formula_inventory_sha,
                    "adapted_formulas": len(changes), "adaptation_inventory_sha256": adaptation_inventory_sha,
                    "unchanged_nested_livechecks": sorted(nested_seen), "changes": changes}
          report_path = root.parent / "formula-adaptation.json"
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          print("Verified metadata-only formula adaptation: " + str(report_path))
          PY
          # Install through a clean core checkout, then restore the runner's tap intact.
          install_pid=
          install_started=0
          install_signal=TERM
          restore_core() {
            install_status=$?
            trap - EXIT
            trap '' INT TERM
            if test "$install_started" = 1; then
              # Cover a signal between launching the job and assigning its PID.
              install_pid="${install_pid:-${!:-}}"
              if test -n "$install_pid"; then
                kill "-$install_signal" -- "-$install_pid" 2>/dev/null || true
                # Async descendants may ignore INT; bound their shutdown too.
                if test "$install_signal" = INT; then
                  kill -TERM -- "-$install_pid" 2>/dev/null || true
                fi
                install_waits=10
                while kill -0 -- "-$install_pid" 2>/dev/null && test "$install_waits" -gt 0; do
                  sleep 0.1
                  install_waits=$((install_waits - 1))
                done
                kill -KILL -- "-$install_pid" 2>/dev/null || true
                wait "$install_pid" 2>/dev/null || true
              fi
            fi
            if ! test -e "$pinned_core" && { test -e "$core" || test -L "$core"; }; then
              mv "$core" "$pinned_core" || exit 1
            fi
            if test -e "$saved_core" || test -L "$saved_core"; then
              mv "$saved_core" "$core" || exit 1
            fi
            exit "$install_status"
          }
          trap restore_core EXIT
          trap 'install_signal=INT; exit 130' INT
          trap 'exit 143' TERM
          if test -e "$core" || test -L "$core"; then
            mv "$core" "$saved_core"
          fi
          mv "$pinned_core" "$core"
          # Foreground commands defer shell-PID cancellation traps. Isolate the
          # install job's group, then wait interruptibly without job control.
          set -m
          install_started=1
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --force-bottle llvm@19 lld@19 &
          install_pid=$!
          set +m
          wait "$install_pid"
          install_started=0
          install_pid=
          llvm_bin="$(brew --prefix llvm@19)/bin"
          lld_bin="$(brew --prefix lld@19)/bin"
          test "$("$llvm_bin/llvm-config" --version)" = "19.1.7"
          tools="$RUNNER_TEMP/oxid-llvm-19"
          mkdir "$tools"
          ln -s "$llvm_bin/clang" "$tools/clang"
          ln -s "$llvm_bin/opt" "$tools/opt"
          ln -s "$lld_bin/ld64.lld" "$tools/ld64.lld"
          "$tools/clang" --version
          "$tools/opt" --version
          "$tools/ld64.lld" --version
          oxid_sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          test -n "$oxid_sdkroot"
          echo "OXID_LLVM_BIN=$tools" >> "$GITHUB_ENV"
          echo "SDKROOT=$oxid_sdkroot" >> "$GITHUB_ENV"
      - name: Build both current compiler profiles
        run: |
          cargo build --locked
          cargo build --release --locked
      - name: Verify native diagnosis on the actual host
        run: cargo test --locked --test native_doctor -- --include-ignored --test-threads=1
      - name: Verify native file lifetime and failure contracts
        run: python3 -B scripts/test_native_files_runtime.py
      - name: Verify Mach-O execution and deployment
        run: |
          python3 -B scripts/verify_macos_native.py target/debug/oxid target/release/oxid \
            --llvm-bin "$OXID_LLVM_BIN" --output "$RUNNER_TEMP/current-macos-native"
          python3 -B scripts/verify_typed_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-macos-native/typed-vectors" --llvm-bin "$OXID_LLVM_BIN"
          python3 -B scripts/verify_copy_records.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-macos-native/copy-records" --llvm-bin "$OXID_LLVM_BIN"
          python3 -B scripts/verify_copy_record_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-macos-native/copy-record-vectors" --llvm-bin "$OXID_LLVM_BIN"
      - name: Retain native programs and raw transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-macos-native-${{ matrix.os }}
          path: ${{ runner.temp }}/current-macos-native
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  current-windows-native:
    name: Current Windows MSVC x64 scalar native programs
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Initialize the installed x64 Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Installed MSVC x64 tools are required' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $settings = & $env:ComSpec /d /s /c "`"`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 >nul && set`""
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio environment initialization failed' }
          $names = @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir',
            'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'WindowsSDKLibVersion',
            'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')
          foreach ($line in $settings) {
            if ($line -match '^([^=][^=]*)=(.*)$' -and $names -contains $Matches[1]) {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8
            }
          }
      - name: Verify and extract the complete LLVM 19.1.7 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'clang+llvm-19.1.7-x86_64-pc-windows-msvc.tar.xz'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang%2Bllvm-19.1.7-x86_64-pc-windows-msvc.tar.xz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 845236708) { throw 'LLVM archive length differs' }
          # Digest from the fixed bazel-contrib/toolchains_llvm catalog:
          # 7c6f33bf0ec0345e5c75fefeceb37d1b2177a2c6/toolchain/distributions/github.jsonc
          $digest = 'b4557b4f012161f56a2f5d9e877ab9635cafd7a08f7affe14829bd60c9d357f0'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $digest) {
            throw 'LLVM archive SHA256 differs'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'oxid-llvm-msvc'
          New-Item -ItemType Directory -Path $extract | Out-Null
          tar -xJf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed' }
          $bin = Join-Path $extract 'clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin'
          foreach ($tool in @('clang.exe', 'opt.exe', 'lld-link.exe')) {
            $version = & (Join-Path $bin $tool) --version
            if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch '(?m)(clang version|LLVM version|LLD) 19\.1\.7(?:[ (]|$)') {
              throw "Wrong LLVM tool: $tool"
            }
            $version
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OXID_LLVM_BIN=$bin" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding utf8
      - name: Build both compiler profiles
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows diagnosis, capture limits and source admission
        run: |
          cargo test --locked --bin oxid frontend::native::doctor::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test native_doctor --test typed_windows_native -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PE execution, publication and standalone deployment
        run: |
          python -B scripts/verify_windows_native.py target/debug/oxid.exe target/release/oxid.exe `
            --llvm-bin "$env:OXID_LLVM_BIN" --output "$env:RUNNER_TEMP/current-windows-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain PE programs and raw transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-windows-native-msvc-x64
          path: |
            ${{ runner.temp }}/current-windows-native
            !${{ runner.temp }}/current-windows-native/tools/opt.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cross-platform:
    name: Current compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows installer and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shells = @((Get-Command pwsh).Source, (Get-Command powershell.exe).Source)
          foreach ($installerShell in $shells) {
            $env:OXID_TEST_POWERSHELL = $installerShell
            python -B -m unittest discover -s scripts -p test_windows_installer.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and test current compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo test --all-targets --all-features --locked
          cargo run --release --locked -- test
          cargo run --release --locked -- build
          cargo run --release --locked -- --version
          cargo run --release --locked -- bootstrap
          cargo run --release --locked -- bootstrap --check
      - name: Verify current typed formatter
        shell: bash
        run: |
          binary=target/release/oxid
          if test "$RUNNER_OS" = Windows; then binary=target/release/oxid.exe; fi
          python scripts/verify_typed_formatter.py "$binary"
      - name: Exercise current benchmark reporting
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked -- bench --iterations 3 --json target/oxid-benchmark.json
          python scripts/verify_benchmark_report.py target/oxid-benchmark.json 3
      - name: Retain current compiler demonstration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: current-compiler-${{ matrix.os }}
          path: .oxid/bootstrap/compiler.oxb
          include-hidden-files: true
          if-no-files-found: error

  compiler-artifact-equivalence:
    name: Current compiler demonstration artifact equivalence
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: current-compiler-*
          path: current-compiler-artifacts
      - run: python3 scripts/verify_bootstrap_artifacts.py current-compiler-artifacts 5

  native-projects:
    name: Current native project and source-free regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE
    env:
      OXID_LLVM_BIN: /usr/lib/llvm-19/bin
      OXID_TEST_LLVM_BIN: /usr/lib/llvm-19/bin
    steps:
      - name: Install pinned LLVM and host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev python3 binutils strace gdb \
            clang-19=1:19.1.7-3+b1 llvm-19=1:19.1.7-3+b1 lld-19=1:19.1.7-3+b1 \
            libllvm19=1:19.1.7-3+b1 libclang-cpp19=1:19.1.7-3+b1 \
            libclang-common-19-dev=1:19.1.7-3+b1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Run public native tests in both compiler profiles
        env:
          OXID_LOCAL_REFERENCES_NATIVE_EVIDENCE: ${{ runner.temp }}/current-local-reference-bindings
          OXID_GENERIC_FIELD_BORROWS_NATIVE_EVIDENCE: ${{ runner.temp }}/current-generic-field-borrows
          OXID_NATIVE_REACHABILITY_EVIDENCE: ${{ runner.temp }}/current-native-reachability
        shell: bash
        run: |
          for profile in debug release; do
            profile_flags=()
            if test "$profile" = release; then profile_flags=(--release); fi
            cargo test --locked "${profile_flags[@]}" \
              --test project_workflow --test typed_path_dependencies --test typed_package_lock --test typed_workspace --test typed_package --test native_incremental --test native_doctor \
              --test typed_native --test typed_process --test reproducible_native --test native_profiles \
              --test owned_enum_payloads --test owned_enum_payload_acceptance --test byte_record_fields --test bytebuf_binary --test hosted_execution --test byte_buffer_transfer --test byte_strings --test native_files --test process_arguments --test typed_i64 --test typed_integer_widths --test typed_byte_integers --test typed_integer128 --test typed_integer_bits --test typed_floats --test typed_float_roots --test typed_characters --test record_field_borrows --test local_references --test typed_git_dependencies --test hosted_recursion
            cargo test --locked "${profile_flags[@]}" --test typed_copy_records --test typed_copy_record_vectors
            cargo test --locked "${profile_flags[@]}" \
              --test project_workflow --test typed_path_dependencies --test typed_package_lock --test typed_workspace --test typed_package --test native_incremental --test native_doctor \
              --test typed_fixed_arrays --test typed_division \
              --test typed_unary_negation --test typed_slices --test typed_projected_slices \
              --test typed_record_composition --test typed_hir_import --test reproducible_native --test native_profiles \
              --test owned_enum_payloads --test owned_enum_payload_acceptance --test byte_record_fields --test bytebuf_binary --test hosted_execution --test byte_buffer_transfer --test byte_strings --test native_files --test process_arguments --test typed_i64 --test typed_integer_widths --test typed_byte_integers --test typed_integer128 --test typed_integer_bits --test typed_floats --test typed_float_roots --test typed_characters --test record_field_borrows --test local_references --test typed_git_dependencies --test hosted_recursion --test typed_generics --test typed_nominal_generics --test typed_record_patterns --test typed_record_enum_fields --test typed_constructor_inference --test typed_range_for --test native_debug_info -- --include-ignored
            mkdir "$RUNNER_TEMP/current-copy-record-debug-$profile"
            TMPDIR="$RUNNER_TEMP/current-copy-record-debug-$profile" OXID_TEST_KEEP_ARTIFACTS=1 \
              cargo test --locked "${profile_flags[@]}" --test native_copy_record_debug \
              -- --include-ignored --test-threads=1 --nocapture
            cargo test --locked "${profile_flags[@]}" --bin oxid \
