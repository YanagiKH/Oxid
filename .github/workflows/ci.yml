  linux-arm64-native:
    name: Current Linux ARM64 native programs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    container:
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE
    env:
      OXID_LLVM_BIN: /usr/lib/llvm-19/bin
      OXID_TEST_LLVM_BIN: /usr/lib/llvm-19/bin
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Install pinned ARM64 LLVM and host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev python3 binutils strace gdb \
            clang-19=1:19.1.7-3+b1 llvm-19=1:19.1.7-3+b1 lld-19=1:19.1.7-3+b1 \
            libllvm19=1:19.1.7-3+b1 libclang-cpp19=1:19.1.7-3+b1 \
            libclang-common-19-dev=1:19.1.7-3+b1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check ARM64 code and ordinary regressions
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Verify native ARM64 builds and source-free execution
        env:
          OXID_LOCAL_REFERENCES_NATIVE_EVIDENCE: ${{ runner.temp }}/linux-arm64-native/local-reference-bindings
          OXID_GENERIC_FIELD_BORROWS_NATIVE_EVIDENCE: ${{ runner.temp }}/linux-arm64-native/generic-field-borrows
          OXID_NATIVE_REACHABILITY_EVIDENCE: ${{ runner.temp }}/linux-arm64-native/native-reachability
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          python3 -B scripts/verify_linux_arm64_native.py \
            --repo . --expected-head "$EXPECTED_HEAD" \
            --llvm-bin "$OXID_LLVM_BIN" --output "$RUNNER_TEMP/linux-arm64-native"
          python3 -B scripts/verify_typed_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/linux-arm64-native/typed-vectors" --llvm-bin "$OXID_LLVM_BIN"
          python3 -B scripts/verify_copy_records.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/linux-arm64-native/copy-records" --llvm-bin "$OXID_LLVM_BIN"
          python3 -B scripts/verify_copy_record_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/linux-arm64-native/copy-record-vectors" --llvm-bin "$OXID_LLVM_BIN"
      - name: Verify local reference lifetimes on ARM64
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            profile_flags=()
            if test "$profile" = release; then profile_flags=(--release); fi
            OXID_OWNED_NATIVE_EVIDENCE="$RUNNER_TEMP/linux-arm64-native/local-references-$profile" cargo test --locked "${profile_flags[@]}" --bin oxid native_local_reference_lifetimes_and_every_fuel_boundary_use_real_llvm -- --ignored --test-threads=1
            cargo test --locked "${profile_flags[@]}" --bin oxid \
              native::copy_record_tests:: -- --ignored --test-threads=1
            mkdir "$RUNNER_TEMP/linux-arm64-native/copy-record-debug-$profile"
            TMPDIR="$RUNNER_TEMP/linux-arm64-native/copy-record-debug-$profile" OXID_TEST_KEEP_ARTIFACTS=1 \
              cargo test --locked "${profile_flags[@]}" --test native_copy_record_debug \
              -- --include-ignored --test-threads=1 --nocapture
          done
      - name: Retain ARM64 native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-linux-arm64-native
          path: ${{ runner.temp }}/linux-arm64-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  workflow-lint:
    name: Current workflow and metadata audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all workflow YAML
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate package metadata
        run: python3 -c "import json, tomllib; json.load(open('license-metadata.json')); tomllib.load(open('Cargo.toml','rb')); tomllib.load(open('oxid.toml','rb'))"
