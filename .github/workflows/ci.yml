name: Repository CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  historical-qualification:
    name: Historical certificates (9ff8ef9; not current-source evidence)
    uses: ./.github/workflows/historical-qualification.yml

  quality-and-repository:
    name: Current source quality and project verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check current formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Run all current Rust and public CLI regressions
        run: cargo test --all-targets --all-features --locked
      - name: Test current qualification and release controls
        run: |
          python3 -B scripts/run_current_script_tests.py
          python3 -B scripts/check_release_gates.py
      - name: Run retained semantic and resource assertions on current sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/verify_file_seek_compatibility.py \
            --repo . \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/current-project-unit2"
      - name: Verify current optimized compiler and repository programs
        run: |
          cargo build --release --locked
          python3 scripts/verify_owned_witness_privacy.py
          python3 scripts/verify_i32_literals.py target/release/oxid
          python3 scripts/verify_i32_arithmetic.py target/debug/oxid target/release/oxid
          python3 -B scripts/verify_i64.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-i64-reference" --reference-only
          python3 -B scripts/verify_integer_widths.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-integer-widths-reference" --reference-only
          python3 -B scripts/verify_byte_integers.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-byte-integer-reference" --reference-only
          python3 -B scripts/verify_integer128.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-integer128-reference" --reference-only
          python3 -B scripts/verify_integer_bits.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-integer-bits-reference" --reference-only
          python3 -B scripts/verify_floats.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-float-reference" --reference-only
          python3 -B scripts/verify_float_roots.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-float-roots-reference" --reference-only
          python3 -B scripts/verify_characters.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-character-reference" --reference-only
          python3 scripts/verify_repo.py target/release/oxid
          python3 -B scripts/verify_typed_package_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-interpreter"
          python3 -B scripts/verify_typed_package_lock.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-lock-interpreter"
          python3 -B scripts/verify_typed_workspace_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-workspace-interpreter"
          python3 -B scripts/verify_typed_package_bundle.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-bundle-interpreter"
          python3 -B scripts/verify_utf8_text_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-utf8-text-interpreter" --reference-only
          python3 -B scripts/verify_utf8_characters.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-utf8-characters-interpreter" --reference-only
          python3 -B scripts/verify_float_vector.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-float-vector-interpreter" --reference-only
          python3 -B scripts/verify_typed_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-typed-vector-interpreter" --reference-only
          python3 -B scripts/verify_copy_records.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-copy-record-interpreter" --reference-only
          python3 -B scripts/verify_copy_record_vectors.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-copy-record-vector-interpreter" --reference-only
          python3 -B scripts/verify_matrices.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-matrix-interpreter" --reference-only
      - name: Retain current source qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-project-unit2
          path: |
            ${{ runner.temp }}/current-project-unit2
            ${{ runner.temp }}/current-i64-reference
            ${{ runner.temp }}/current-integer-widths-reference
            ${{ runner.temp }}/current-byte-integer-reference
            ${{ runner.temp }}/current-integer128-reference
            ${{ runner.temp }}/current-integer-bits-reference
            ${{ runner.temp }}/current-character-reference
            ${{ runner.temp }}/current-float-reference
            !${{ runner.temp }}/current-project-unit2/**/target/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current package interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-interpreter
          path: ${{ runner.temp }}/current-package-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current package lock interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-lock-interpreter
          path: ${{ runner.temp }}/current-package-lock-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current workspace interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-workspace-interpreter
          path: ${{ runner.temp }}/current-workspace-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current source package interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-bundle-interpreter
          path: ${{ runner.temp }}/current-package-bundle-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current UTF-8 interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-utf8-text-interpreter
          path: |
            ${{ runner.temp }}/current-utf8-text-interpreter
            ${{ runner.temp }}/current-utf8-characters-interpreter
            ${{ runner.temp }}/current-typed-vector-interpreter
            ${{ runner.temp }}/current-copy-record-interpreter
            ${{ runner.temp }}/current-copy-record-vector-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Verify current source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/oxid-install"
          "$RUNNER_TEMP/oxid-install/bin/oxid" --version
      - name: Build and smoke-test current container image
        run: |
          docker build --tag oxid:current .
          docker run --rm oxid:current --version

