name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: oxid-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-and-repository:
    name: Full repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Test feature status metadata validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust and native bridge tests
        run: cargo test --all-targets --all-features --locked

      - name: Build optimized standalone runtime
        run: cargo build --release --locked

      - name: Verify exact i32 literals against the independent Python integer oracle
        run: python3 scripts/verify_i32_literals.py target/release/oxid

      - name: Verify checked i32 arithmetic and debug-release parity with Python integers
        run: python3 scripts/verify_i32_arithmetic.py target/debug/oxid target/release/oxid

      - name: Verify every Oxid source, runnable program, README, SVG, build, and doctor check
        run: python3 scripts/verify_repo.py target/release/oxid

      - name: Test source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/oxid-install"
          "$RUNNER_TEMP/oxid-install/bin/oxid" --version

      - name: Build container image
        run: docker build --tag oxid:ci .

      - name: Smoke-test container image
        run: docker run --rm oxid:ci --version

  cross-platform:
    name: ${{ matrix.name }} runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            binary: target/release/oxid
            artifact: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            binary: target/release/oxid.exe
            artifact: windows-x86_64
          - name: macOS x86_64
            os: macos-15-intel
            binary: target/release/oxid
            artifact: macos-x86_64
          - name: macOS arm64
            os: macos-14
            binary: target/release/oxid
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Build optimized runtime
        run: cargo build --release --locked

      - name: Run unit and native bridge tests
        run: cargo test --all-targets --locked

      - name: Run Oxid language tests
        run: cargo run --release --locked -- test

      - name: Run concise syntax example
        run: cargo run --release --locked -- run examples/oxid_shortcuts.ox

      - name: Build the repository bundle
        run: cargo run --release --locked -- build

      - name: Check runtime version
        run: cargo run --release --locked -- --version

      - name: Verify compiler-demo artifact serialization round-trip
        run: cargo run --release --locked -- bootstrap

      - name: Recheck artifact round-trip without rewriting artifacts
        run: cargo run --release --locked -- bootstrap --check

      - name: Run the bounded performance framework
        run: cargo run --release --locked -- bench --iterations 3 --json target/oxid-benchmark.json

      - name: Validate the benchmark JSON schema
        run: python scripts/verify_benchmark_report.py target/oxid-benchmark.json 3

      - name: Upload the serialized compiler-demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.artifact }}
          path: .oxid/bootstrap/compiler.oxb
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  compiler-artifact-equivalence:
    name: Cross-platform serialized-AST artifact equivalence
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform compiler artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-*
          path: compiler-artifacts

      - name: Verify byte-identical serialized compiler-demo artifacts
        run: python3 scripts/verify_bootstrap_artifacts.py compiler-artifacts 4

  workflow-lint:
    name: Workflow and metadata audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate manifest metadata
        run: python3 -c "import json, tomllib; json.load(open('license-metadata.json')); tomllib.load(open('Cargo.toml','rb')); tomllib.load(open('oxid.toml','rb'))"

  native-scalar-preview:
    name: Experimental LLVM scalar native (Linux x86_64)
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    env:
      OXID_LLVM_BIN: /usr/lib/llvm-19/bin
    steps:
      - name: Install the pinned LLVM preview tools and host C environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev python3 binutils \
            clang-19=1:19.1.7-3+b1 llvm-19=1:19.1.7-3+b1 lld-19=1:19.1.7-3+b1 \
            libllvm19=1:19.1.7-3+b1 libclang-cpp19=1:19.1.7-3+b1 \
            libclang-common-19-dev=1:19.1.7-3+b1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compiler and run admission/tool-boundary regressions
        run: |
          cargo test --locked --test typed_native
          cargo build --release --locked
      - name: Verify actual LLVM compilation, reference parity, and ELF artifacts
        run: python3 scripts/verify_native_preview.py target/release/oxid
