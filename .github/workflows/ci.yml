name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: oxid-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-and-repository:
    name: Full repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Qualified private gates reproduce the reviewed Rust 1.99.0 toolchain.
      # The separate four-host ordinary matrix deliberately follows stable.
      - name: Install qualified Rust quality components
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies before offline private qualification
        run: cargo fetch --locked

      # Check exact src/native membership before legacy checks can create caches.
      - name: Preserve Unit2 semantic and resource gates with explicit current inputs
        run: |
          python3 -B tests/fixtures/typed_project_unit3_compatibility/run.py \
            --repo . \
            --source-manifest tests/fixtures/typed_project_unit3_compatibility/source-inputs-unit3-platform-v2.json \
            --cargo "$(rustup which cargo)" --rustc "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/typed-project-unit2-results"

      - name: Test feature status metadata validation
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust and native bridge tests
        run: cargo test --all-targets --all-features --locked

      - name: Check private ownership witness construction and immutability
        run: python3 scripts/verify_owned_witness_privacy.py

      - name: Verify private typed source-set identity and resource regressions
        run: python3 -B tests/fixtures/typed_project_unit1_independent/run.py --repo . --profile both --output "$RUNNER_TEMP/typed-project-unit1-results"

      - name: Build optimized standalone runtime
        run: cargo build --release --locked

      - name: Preserve public single-file behavior and the closed project source gate
        run: python3 -B tests/fixtures/typed_project_unit1_compatibility/run.py --debug target/debug/oxid --release target/release/oxid --evidence-root "$RUNNER_TEMP"

      - name: Test typed-project runner identity controls
        run: python3 -B -m unittest discover -s tests/fixtures/typed_project_unit2_independent -p 'test_protocol.py' -v

      - name: Check private typed-project source and index seals
        run: python3 -B tests/fixtures/typed_project_unit2_seal/run.py --repo . --output "$RUNNER_TEMP/typed-project-unit2-seal-results" --rustc rustc

      - name: Report typed-project qualification identities and counts
        if: always()
        shell: bash
        run: |
          for receipt in "$RUNNER_TEMP/typed-project-unit2-results/result.json" "$RUNNER_TEMP/typed-project-unit2-results/run/result.json" "$RUNNER_TEMP/typed-project-unit2-results/run/debug-receipt.json" "$RUNNER_TEMP/typed-project-unit2-results/run/release-receipt.json" "$RUNNER_TEMP/typed-project-unit2-seal-results/result.json"; do
            if test -f "$receipt"; then
              cat "$receipt"
            fi
          done
          if test -f "$RUNNER_TEMP/typed-project-unit2-results/run/rustc-version.stdout"; then
            cat "$RUNNER_TEMP/typed-project-unit2-results/run/rustc-version.stdout"
          fi
          for observations in "$RUNNER_TEMP/typed-project-unit2-results/run/"*-raw.jsonl "$RUNNER_TEMP/typed-project-unit2-results/run/"*-normalized.jsonl; do
            if test -f "$observations"; then
              gzip -6 -k "$observations"
            fi
          done

      - name: Retain compact typed-project qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-project-unit2-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/typed-project-unit2-results/*.json
            ${{ runner.temp }}/typed-project-unit2-results/*.jsonl.gz
            ${{ runner.temp }}/typed-project-unit2-results/*.stdout
            ${{ runner.temp }}/typed-project-unit2-results/*.stderr
            ${{ runner.temp }}/typed-project-unit2-results/run/*.json
            ${{ runner.temp }}/typed-project-unit2-results/run/*.jsonl.gz
            ${{ runner.temp }}/typed-project-unit2-results/run/*.stdout
            ${{ runner.temp }}/typed-project-unit2-results/run/*.stderr
            ${{ runner.temp }}/typed-project-unit2-seal-results/*.json
            ${{ runner.temp }}/typed-project-unit2-seal-results/*.stdout
            ${{ runner.temp }}/typed-project-unit2-seal-results/*.stderr

      - name: Verify exact i32 literals against the independent Python integer oracle
        run: python3 scripts/verify_i32_literals.py target/release/oxid

      - name: Verify checked i32 arithmetic and debug-release parity with Python integers
        run: python3 scripts/verify_i32_arithmetic.py target/debug/oxid target/release/oxid

      - name: Verify every Oxid source, runnable program, README, SVG, build, and doctor check
        run: python3 scripts/verify_repo.py target/release/oxid

      - name: Test source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/oxid-install"
          "$RUNNER_TEMP/oxid-install/bin/oxid" --version

      - name: Build container image
        run: docker build --tag oxid:ci .

      - name: Smoke-test container image
        run: docker run --rm oxid:ci --version

  cross-platform:
    name: ${{ matrix.name }} runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            binary: target/release/oxid
            artifact: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            binary: target/release/oxid.exe
            artifact: windows-x86_64
          - name: macOS x86_64
            os: macos-15-intel
            binary: target/release/oxid
            artifact: macos-x86_64
          - name: macOS arm64
            os: macos-14
            binary: target/release/oxid
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Build optimized runtime
        run: cargo build --release --locked

      - name: Run unit and native bridge tests
        run: cargo test --all-targets --locked

      - name: Run Oxid language tests
        run: cargo run --release --locked -- test

      - name: Run concise syntax example
        run: cargo run --release --locked -- run examples/oxid_shortcuts.ox

      - name: Build the repository bundle
        run: cargo run --release --locked -- build

      - name: Check runtime version
        run: cargo run --release --locked -- --version

      - name: Verify compiler-demo artifact serialization round-trip
        run: cargo run --release --locked -- bootstrap

      - name: Recheck artifact round-trip without rewriting artifacts
        run: cargo run --release --locked -- bootstrap --check

      - name: Run the bounded performance framework
        run: cargo run --release --locked -- bench --iterations 3 --json target/oxid-benchmark.json

      - name: Validate the benchmark JSON schema
        run: python scripts/verify_benchmark_report.py target/oxid-benchmark.json 3

      - name: Upload the serialized compiler-demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.artifact }}
          path: .oxid/bootstrap/compiler.oxb
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  compiler-artifact-equivalence:
    name: Cross-platform serialized-AST artifact equivalence
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform compiler artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-*
          path: compiler-artifacts

      - name: Verify byte-identical serialized compiler-demo artifacts
        run: python3 scripts/verify_bootstrap_artifacts.py compiler-artifacts 4

  workflow-lint:
    name: Workflow and metadata audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate manifest metadata
        run: python3 -c "import json, tomllib; json.load(open('license-metadata.json')); tomllib.load(open('Cargo.toml','rb')); tomllib.load(open('oxid.toml','rb'))"

  native-scalar-preview:
    name: Experimental LLVM scalar native (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: debian:trixie-slim
    env:
      OXID_LLVM_BIN: /usr/lib/llvm-19/bin
    steps:
      - name: Install the pinned LLVM preview tools and host C environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev python3 binutils \
            clang-19=1:19.1.7-3+b1 llvm-19=1:19.1.7-3+b1 lld-19=1:19.1.7-3+b1 \
            libllvm19=1:19.1.7-3+b1 libclang-cpp19=1:19.1.7-3+b1 \
            libclang-common-19-dev=1:19.1.7-3+b1
      - uses: actions/checkout@v4
      # Native private qualification shares the reviewed Rust/LLVM pair.
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch locked dependencies before offline private qualification
        run: cargo fetch --locked
      - name: Qualify all private Unit3 source, native and mutation cases
        id: unit3_qualification
        timeout-minutes: 120
        shell: bash
        env:
          PYTHONOPTIMIZE: "0"
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          unit3_repo="$PWD"
          unit3_out="$RUNNER_TEMP/typed-project-unit3"
          unit3_pkg="$unit3_repo/tests/fixtures/typed_project_unit3_independent"
          unit3_python="$(command -v python3)"
          unit3_rustc="$(rustup which rustc)"
          unit3_cargo="$(rustup which cargo)"
          unit3_rustdoc="$(rustup which rustdoc)"
          unit3_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          unit3_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          unit3_cc="$(command -v cc)"
          unit3_cxx="$(command -v c++)"
          unit3_ar="$(command -v ar)"
          unit3_llvm_bin="$OXID_LLVM_BIN"
          unit3_llvm_lib_dir="$unit3_out/llvm-runtime/libraries"
          "$unit3_python" -B "$unit3_pkg/portable/verify_package.py" --package "$unit3_pkg" \
            --manifest "$unit3_pkg/package-manifest.json" --receipt "$unit3_out/package-verification.json"

          "$unit3_python" -B "$unit3_pkg/portable/native-v1/stage_llvm_runtime.py" \
            --output "$unit3_out/llvm-runtime"

          "$unit3_python" -B "$unit3_pkg/portable/transport.py" materialize \
            --archive "$unit3_pkg/source-transport/sources.tar.gz" \
            --manifest "$unit3_pkg/source-transport/source-transport.json" \
            --requests "$unit3_pkg/source-transport/requests.jsonl" --output "$unit3_out/inputs"

          "$unit3_python" -B "$unit3_pkg/portable/bridge.py" --repo "$unit3_repo" \
            --selected-manifest "$unit3_pkg/manifests/selected-current.json" \
            --core-manifest "$unit3_pkg/manifests/core-v1.json" \
            --platform-patch "$unit3_pkg/manifests/platform-scope.patch" \
            --original-test "$unit3_pkg/manifests/project_execution_tests.core-v1.rs" \
            --output "$unit3_out/bridge"

          "$unit3_python" -B "$unit3_pkg/portable/assemble.py" \
            --repo "$unit3_out/bridge/derived-core-v1" --core-manifest "$unit3_pkg/manifests/core-v1.json" \
            --observer-root "$unit3_pkg/components/observer" \
            --observer-freeze "$unit3_pkg/components/observer/adapter-freeze-v1.json" \
            --output "$unit3_out/observer"

          for unit3_profile in debug release; do
            "$unit3_python" -B "$unit3_pkg/portable/build.py" \
              --prepared-manifest "$unit3_out/observer/prepared-source.json" \
              --output "$unit3_out/source-build-$unit3_profile" --target-dir "$unit3_out/source-target" \
              --profile "$unit3_profile" --jobs 2 --rustc "$unit3_rustc" --cargo "$unit3_cargo" \
              --rustdoc "$unit3_rustdoc" --cargo-home "$unit3_cargo_home" --cc "$unit3_cc" --cxx "$unit3_cxx" --ar "$unit3_ar"
          done

          "$unit3_python" -B "$unit3_pkg/portable/make_plan.py" --kind source \
            --materialization "$unit3_out/inputs/materialization.json" \
            --prepared "$unit3_out/observer/prepared-source.json" --wrapper "$unit3_pkg/portable/observe.py" \
            --debug-build "$unit3_out/source-build-debug/build.json" \
            --release-build "$unit3_out/source-build-release/build.json" \
            --receipt-root "$unit3_out/source-receipts" --output "$unit3_out/source-plan.json"
          unit3_source_plan_sha=$(sha256sum "$unit3_out/source-plan.json" | cut -d' ' -f1)
          "$unit3_python" -B "$unit3_pkg/portable/collect.py" --plan "$unit3_out/source-plan.json" \
            --plan-sha256 "$unit3_source_plan_sha" --python "$unit3_python" --output "$unit3_out/source-collection"

          "$unit3_python" -B "$unit3_pkg/portable/native-v1/auxiliary_transport.py" \
            --auxiliary-root "$unit3_pkg/components/native-driver/auxiliary" \
            --original-manifest "$unit3_pkg/components/native-driver/auxiliary-manifest-v1.json" \
            --output "$unit3_out/native-auxiliary"
          "$unit3_python" -B "$unit3_pkg/portable/native-v1/native_inputs.py" \
            --bridge-receipt "$unit3_out/bridge/bridge-receipt.json" \
            --core-manifest "$unit3_pkg/manifests/core-v1.json" \
            --overlay-manifest "$unit3_pkg/components/native-driver/overlay-manifest-v2.json" \
            --overlay-patch "$unit3_pkg/components/native-driver/overlay-v2.patch" \
            --auxiliary-root "$unit3_out/native-auxiliary/inputs" --output "$unit3_out/native-inputs"
          "$unit3_python" -B "$unit3_pkg/portable/native-v1/native_portable_grouped.py" prepare \
            --repo "$unit3_out/native-inputs/inputs" --core-manifest "$unit3_pkg/manifests/core-v1.json" \
            --native-root "$unit3_pkg/components/native-driver" \
            --native-manifest "$unit3_pkg/components/native-driver/artifact-manifest.json" \
            --oracle-manifest "$unit3_pkg/components/oracles/pre-execution-manifest.json" \
            --native-supplement "$unit3_pkg/components/oracles/supplements/native-diagnostics-v1/supplement-manifest.json" \
            --native-fuel-requests "$unit3_pkg/components/oracles/supplements/native-diagnostics-v1/fuel-requests.jsonl" \
            --materialization "$unit3_out/inputs/materialization.json" --output "$unit3_out/native"
          "$unit3_python" -B "$unit3_pkg/portable/native-v1/native_portable_grouped.py" build \
            --prepared-manifest "$unit3_out/native/native-prepared.json" --profile both \
            --rustc "$unit3_rustc" --llvm-bin "$unit3_llvm_bin" --llvm-lib-dir "$unit3_llvm_lib_dir" \
            --cargo-home "$unit3_cargo_home" --rustup-home "$unit3_rustup_home" \
            --receipt "$unit3_out/native-build-wrapper.json"
          "$unit3_python" -B "$unit3_pkg/portable/make_plan.py" --kind native \
            --materialization "$unit3_out/inputs/materialization.json" --prepared "$unit3_out/native/native-prepared.json" \
            --wrapper "$unit3_pkg/portable/native-v1/native_portable_grouped.py" \
            --debug-build "$unit3_out/native/native-component/build-debug/verified-build.json" \
            --release-build "$unit3_out/native/native-component/build-release/verified-build.json" \
            --build-wrapper "$unit3_out/native-build-wrapper.json" \
            --receipt-root "$unit3_out/native-wrappers" --output "$unit3_out/native-plan.json"
          unit3_native_plan_sha=$(sha256sum "$unit3_out/native-plan.json" | cut -d' ' -f1)
          "$unit3_python" -B "$unit3_pkg/portable/collect.py" --plan "$unit3_out/native-plan.json" \
            --plan-sha256 "$unit3_native_plan_sha" --python "$unit3_python" --output "$unit3_out/native-collection" \
            --rustc "$unit3_rustc" --llvm-bin "$unit3_llvm_bin" --llvm-lib-dir "$unit3_llvm_lib_dir" \
            --cargo-home "$unit3_cargo_home" --rustup-home "$unit3_rustup_home"
          for unit3_variant in v2 v3; do
            "$unit3_python" -B "$unit3_pkg/portable/mutations.py" prepare --variant "$unit3_variant" \
              --observer-prepared "$unit3_out/observer/prepared-source.json" \
              --component-root "$unit3_pkg/components/mutations/$unit3_variant" \
              --oracle-manifest "$unit3_pkg/components/oracles/pre-execution-manifest.json" \
              --mutation-requests "$unit3_pkg/components/oracles/mutation-requests.json" \
              --effective-requests "$unit3_pkg/components/oracles/supplements/mutation-applicability-v1/requests.json" \
              --applicability-manifest "$unit3_pkg/components/oracles/supplements/mutation-applicability-v1/supplement-manifest.json" \
              --output "$unit3_out/mutations-$unit3_variant"
            for unit3_profile in debug release; do
              "$unit3_python" -B "$unit3_pkg/portable/build.py" \
                --prepared-manifest "$unit3_out/mutations-$unit3_variant/prepared-mutation.json" \
                --output "$unit3_out/mutation-build-$unit3_variant-$unit3_profile" \
                --target-dir "$unit3_out/mutations-$unit3_variant/target" \
                --profile "$unit3_profile" --jobs 2 --rustc "$unit3_rustc" --cargo "$unit3_cargo" \
                --rustdoc "$unit3_rustdoc" --cargo-home "$unit3_cargo_home" --cc "$unit3_cc" --cxx "$unit3_cxx" --ar "$unit3_ar"
            done
          done
          "$unit3_python" -B "$unit3_pkg/portable/mutation_gate.py" make \
            --materialization "$unit3_out/inputs/materialization.json" --wrapper "$unit3_pkg/portable/mutations.py" \
            --v2-prepared "$unit3_out/mutations-v2/prepared-mutation.json" \
            --v3-prepared "$unit3_out/mutations-v3/prepared-mutation.json" \
            --v2-debug-build "$unit3_out/mutation-build-v2-debug/build.json" \
            --v2-release-build "$unit3_out/mutation-build-v2-release/build.json" \
            --v3-debug-build "$unit3_out/mutation-build-v3-debug/build.json" \
            --v3-release-build "$unit3_out/mutation-build-v3-release/build.json" \
            --receipt-root "$unit3_out/mutation-receipts" --output "$unit3_out/mutation-plan.json"
          unit3_mutation_plan_sha=$(sha256sum "$unit3_out/mutation-plan.json" | cut -d' ' -f1)
          "$unit3_python" -B "$unit3_pkg/portable/mutation_gate.py" collect --plan "$unit3_out/mutation-plan.json" \
            --plan-sha256 "$unit3_mutation_plan_sha" --python "$unit3_python" --output "$unit3_out/mutation-collection"

          "$unit3_python" -B "$unit3_pkg/portable/comparison-v1/portable_compare.py" prepare \
            --component-root "$unit3_pkg/components/oracles" \
            --component-manifest "$unit3_pkg/portable/comparison-v1/component-manifest.json" \
            --materialization "$unit3_out/inputs/materialization.json" \
            --parser "$unit3_pkg/components/observer/parse_debug.py" --output "$unit3_out/comparison-view"
          "$unit3_python" -B "$unit3_pkg/portable/comparison-v1/portable_compare.py" compare \
            --prepared "$unit3_out/comparison-view/prepared-comparison.json" \
            --plan "$unit3_out/source-plan.json" --plan-sha256 "$unit3_source_plan_sha" \
            --output "$unit3_out/source-comparison"
          "$unit3_python" -B "$unit3_pkg/portable/comparison-v1/portable_compare.py" compare \
            --prepared "$unit3_out/comparison-view/prepared-comparison.json" \
            --plan "$unit3_out/native-plan.json" --plan-sha256 "$unit3_native_plan_sha" \
            --output "$unit3_out/native-comparison"
          unit3_native_evidence_sha=$(sha256sum "$unit3_out/native-comparison/comparison.json" | cut -d' ' -f1)
          "$unit3_python" -B "$unit3_pkg/portable/comparison-v1/portable_compare.py" compare \
            --prepared "$unit3_out/comparison-view/prepared-comparison.json" \
            --plan "$unit3_out/mutation-plan.json" --plan-sha256 "$unit3_mutation_plan_sha" \
            --native-evidence "$unit3_out/native-comparison/comparison.json" \
            --native-evidence-sha256 "$unit3_native_evidence_sha" --output "$unit3_out/mutation-comparison"

      - name: Surface bounded native build failure details
        if: failure() && steps.unit3_qualification.outcome == 'failure'
        timeout-minutes: 1
        env:
          UNIT3_STEP_OUTCOME: ${{ steps.unit3_qualification.outcome }}
        run: python3 -B scripts/collect_unit3_ci_diagnostics.py failure-logs

      - name: Index and preserve Unit3 results on every terminal state
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          UNIT3_STEP_OUTCOME: ${{ steps.unit3_qualification.outcome }}
        run: |
          python3 -B - <<'PYCODE'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "typed-project-unit3"
          root.mkdir(parents=True, exist_ok=True)
          package = pathlib.Path("tests/fixtures/typed_project_unit3_independent")
          selected = []
          for path in sorted(root.rglob("*")):
              if not (path.is_file() or path.is_symlink()):
                  continue
              relative = path.relative_to(root)
              build_cache = "target" in relative.parts or "source-target" in relative.parts
              if build_cache:
                  if path.is_symlink() or not path.name.startswith("oxid-"):
                      continue
                  with path.open("rb") as source:
                      if source.read(4) != b"\x7fELF":
                          continue
              selected.append(path)
          entries = []
          for path in selected:
              name = path.relative_to(root).as_posix()
              if path.is_symlink():
                  entries.append({"path": name, "type": "symlink", "target": os.readlink(path)})
              else:
                  digest = hashlib.sha256()
                  with path.open("rb") as source:
                      while chunk := source.read(1024 * 1024):
                          digest.update(chunk)
                  entries.append({"path": name, "bytes": path.stat().st_size, "sha256": digest.hexdigest()})
          inputs = {}
          for name in ("package-manifest.json", "manifests/selected-current.json", "manifests/core-v1.json"):
              path = package / name
              if path.is_file():
                  inputs[name] = {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          index = root / "ci-evidence-index.json"
          index.write_text(json.dumps({
              "schema": 1,
              "qualification_step_outcome": os.environ.get("UNIT3_STEP_OUTCOME", "unknown"),
              "semantic_receipt_label": "derived core-v1 with production-byte identity bridge to selected successor",
              "direct_successor_semantic_execution": False,
              "package_inputs": inputs,
              "expected_full_plan_rows": {"source": 304, "native": 300, "mutation": 220},
              "driver_attributions": "eight rows joined from the full native comparison; zero extra executions",
              "retained_bytes": sum(row.get("bytes", 0) for row in entries),
              "excluded": "regenerable Rust target caches; exact oxid test executables are retained",
              "files": entries,
          }, indent=2) + "\n")
          archive = root.parent / "typed-project-unit3-evidence.tar.gz"
          with tarfile.open(archive, "w:gz", compresslevel=6, dereference=False) as output:
              for path in selected + [index]:
                  output.add(path, arcname=path.relative_to(root).as_posix(), recursive=False)
          archive_digest = hashlib.sha256()
          with archive.open("rb") as source:
              while chunk := source.read(1024 * 1024):
                  archive_digest.update(chunk)
          (root.parent / "typed-project-unit3-evidence.sha256").write_text(
              archive_digest.hexdigest() + "  " + archive.name + "\n")
          print(json.dumps({"files": len(entries), "retained_bytes": sum(row.get("bytes", 0) for row in entries), "archive_bytes": archive.stat().st_size}))
          PYCODE

      - name: Prepare bounded Unit3 diagnostic receipts
        if: always()
        timeout-minutes: 2
        env:
          UNIT3_STEP_OUTCOME: ${{ steps.unit3_qualification.outcome }}
        run: python3 -B scripts/collect_unit3_ci_diagnostics.py compact

      - name: Retain compact Unit3 diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-project-unit3-compact
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/typed-project-unit3-compact.tar.gz
            ${{ runner.temp }}/typed-project-unit3-compact.tar.gz.sha256

      - name: Retain lossless Unit3 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-project-unit3-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/typed-project-unit3-evidence.tar.gz
            ${{ runner.temp }}/typed-project-unit3-evidence.sha256

      - name: Build the compiler and run admission/tool-boundary regressions
        run: |
          cargo test --locked --test typed_native
          cargo build --release --locked
          cargo test --locked --bin oxid frontend::oir::logical_tests::raw_bool_merge_uses_real_llvm -- --ignored --exact
          cargo test --release --locked --bin oxid frontend::oir::logical_tests::raw_bool_merge_uses_real_llvm -- --ignored --exact
          cargo test --locked --bin oxid frontend::oir::mutable_tests::raw_mutable_places_use_real_llvm -- --ignored --exact
          cargo test --release --locked --bin oxid frontend::oir::mutable_tests::raw_mutable_places_use_real_llvm -- --ignored --exact
          cargo test --locked --bin oxid frontend::oir::verify::cyclic_tests::execution::raw_cyclic_witnesses_use_real_llvm -- --ignored --exact
          cargo test --release --locked --bin oxid frontend::oir::verify::cyclic_tests::execution::raw_cyclic_witnesses_use_real_llvm -- --ignored --exact
          cargo test --locked --bin oxid frontend::oir::loop_control_tests::loop_control_uses_real_llvm -- --ignored --exact
          cargo test --release --locked --bin oxid frontend::oir::loop_control_tests::loop_control_uses_real_llvm -- --ignored --exact
          cargo test --locked --bin oxid frontend::oir::owned::native::tests:: -- --ignored --nocapture --test-threads=1
          cargo test --release --locked --bin oxid frontend::oir::owned::native::tests:: -- --ignored --nocapture --test-threads=1
      - name: Verify held-out owned-source native execution
        run: |
          OXID_REVIEWER_SOURCE_NATIVE_EVIDENCE="$PWD/target/source-review-debug" cargo test --locked --bin oxid frontend::oir::owned::source::reviewer_source::reviewer_source_native_heldout_successes_and_failures -- --ignored --exact --nocapture
          OXID_REVIEWER_SOURCE_NATIVE_EVIDENCE="$PWD/target/source-review-release" cargo test --release --locked --bin oxid frontend::oir::owned::source::reviewer_source::reviewer_source_native_heldout_successes_and_failures -- --ignored --exact --nocapture
      - name: Verify production source CLI and source-free ELF outcomes
        run: python3 scripts/verify_owned_source.py target/debug/oxid target/release/oxid --mode cli --jobs 2
      - name: Verify owned-source native budgets, stores, guards, and artifact identities
        run: python3 scripts/verify_owned_source_native.py --llvm-bin "$OXID_LLVM_BIN" --jobs 2 --evidence target/owned-source-native-ci
      - name: Recheck native matcher rejection controls against real collected evidence
        env:
          NATIVE_OBSERVATIONS: target/owned-source-native-ci/collection
          PYTHONPATH: scripts
        run: python3 -m unittest -v test_owned_source_native_matcher test_owned_source_native_binding
      - name: Verify actual LLVM compilation, reference parity, and ELF artifacts
        run: python3 scripts/verify_native_suite.py target/debug/oxid target/release/oxid --jobs 2
