name: Repository CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  historical-qualification:
    name: Historical certificates (9ff8ef9; not current-source evidence)
    uses: ./.github/workflows/historical-qualification.yml

  quality-and-repository:
    name: Current source quality and project verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check current formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Run all current Rust and public CLI regressions
        run: cargo test --all-targets --all-features --locked
      - name: Test current qualification and release controls
        run: |
          python3 -B scripts/run_current_script_tests.py
          python3 -B scripts/check_release_gates.py
      - name: Run retained semantic and resource assertions on current sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/verify_byte_string_compatibility.py \
            --repo . \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/current-project-unit2"
      - name: Verify current optimized compiler and repository programs
        run: |
          cargo build --release --locked
          python3 scripts/verify_owned_witness_privacy.py
          python3 scripts/verify_i32_literals.py target/release/oxid
          python3 scripts/verify_i32_arithmetic.py target/debug/oxid target/release/oxid
          python3 scripts/verify_repo.py target/release/oxid
          python3 -B scripts/verify_typed_package_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-interpreter"
          python3 -B scripts/verify_typed_package_lock.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-lock-interpreter"
          python3 -B scripts/verify_typed_workspace_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-workspace-interpreter"
          python3 -B scripts/verify_typed_package_bundle.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-bundle-interpreter"
          python3 -B scripts/verify_utf8_text_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-utf8-text-interpreter" --reference-only
      - name: Retain current source qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-project-unit2
          path: |
            ${{ runner.temp }}/current-project-unit2
            !${{ runner.temp }}/current-project-unit2/**/target/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current package interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-interpreter
          path: ${{ runner.temp }}/current-package-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current package lock interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-lock-interpreter
          path: ${{ runner.temp }}/current-package-lock-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current workspace interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-workspace-interpreter
          path: ${{ runner.temp }}/current-workspace-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current source package interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-bundle-interpreter
          path: ${{ runner.temp }}/current-package-bundle-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current UTF-8 interpreter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-utf8-text-interpreter
          path: ${{ runner.temp }}/current-utf8-text-interpreter
          if-no-files-found: warn
          retention-days: 14
      - name: Verify current source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/oxid-install"
          "$RUNNER_TEMP/oxid-install/bin/oxid" --version
      - name: Build and smoke-test current container image
        run: |
          docker build --tag oxid:current .
          docker run --rm oxid:current --version

  source-policy-predecessor:
    name: ByteBuf source-policy controls on their frozen predecessor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain the current replay controller
        run: cp scripts/run_predecessor_script_tests.py "$RUNNER_TEMP/source-policy-replay.py"
      - uses: actions/checkout@v4
        with:
          ref: 2e3fe21f76d0027d2b24cb5c7f02ba38ad354809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B "$RUNNER_TEMP/source-policy-replay.py" --repo . --output "$RUNNER_TEMP/source-policy-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: byte-buffer-source-policy-predecessor
          path: ${{ runner.temp }}/source-policy-replay
          if-no-files-found: error
          retention-days: 14

  hosted-source-policy-predecessor:
    name: Hosted source-policy controls on their frozen predecessor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain the current replay controller
        run: cp scripts/run_hosted_predecessor_tests.py "$RUNNER_TEMP/hosted-source-policy-replay.py"
      - uses: actions/checkout@v4
        with:
          ref: 559a6e6aa0b2ab2022d8fa37546ac62aeac9954e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B "$RUNNER_TEMP/hosted-source-policy-replay.py" --repo . --output "$RUNNER_TEMP/hosted-source-policy-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-source-policy-predecessor
          path: ${{ runner.temp }}/hosted-source-policy-replay
          if-no-files-found: error
          retention-days: 14

  buffer-transfer-source-policy-predecessor:
    name: Buffer-transfer source-policy controls on their frozen predecessor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain the current replay controller
        run: cp scripts/run_buffer_transfer_predecessor_tests.py "$RUNNER_TEMP/buffer-transfer-source-policy-replay.py"
      - uses: actions/checkout@v4
        with:
          ref: c45d519127d314f522762c35879c0c485994ea42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B "$RUNNER_TEMP/buffer-transfer-source-policy-replay.py" --repo . --output "$RUNNER_TEMP/buffer-transfer-source-policy-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffer-transfer-source-policy-predecessor
          path: ${{ runner.temp }}/buffer-transfer-source-policy-replay
          if-no-files-found: error
          retention-days: 14

  cross-platform:
    name: Current compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test current compiler
        run: |
          cargo build --release --locked
          cargo test --all-targets --all-features --locked
          cargo run --release --locked -- test
          cargo run --release --locked -- build
          cargo run --release --locked -- --version
          cargo run --release --locked -- bootstrap
          cargo run --release --locked -- bootstrap --check
      - name: Verify current typed formatter
        shell: bash
        run: |
          binary=target/release/oxid
          if test "$RUNNER_OS" = Windows; then binary=target/release/oxid.exe; fi
          python scripts/verify_typed_formatter.py "$binary"
      - name: Exercise current benchmark reporting
        run: |
          cargo run --release --locked -- bench --iterations 3 --json target/oxid-benchmark.json
          python scripts/verify_benchmark_report.py target/oxid-benchmark.json 3
      - name: Retain current compiler demonstration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: current-compiler-${{ matrix.os }}
          path: .oxid/bootstrap/compiler.oxb
          include-hidden-files: true
          if-no-files-found: error

  compiler-artifact-equivalence:
    name: Current compiler demonstration artifact equivalence
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: current-compiler-*
          path: current-compiler-artifacts
      - run: python3 scripts/verify_bootstrap_artifacts.py current-compiler-artifacts 5

  native-projects:
    name: Current native project and source-free regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:trixie-slim
    env:
      OXID_LLVM_BIN: /usr/lib/llvm-19/bin
    steps:
      - name: Install pinned LLVM and host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev python3 binutils strace \
            clang-19=1:19.1.7-3+b1 llvm-19=1:19.1.7-3+b1 lld-19=1:19.1.7-3+b1 \
            libllvm19=1:19.1.7-3+b1 libclang-cpp19=1:19.1.7-3+b1 \
            libclang-common-19-dev=1:19.1.7-3+b1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Run public native tests in both compiler profiles
        shell: bash
        run: |
          for profile in debug release; do
            profile_flags=()
            if test "$profile" = release; then profile_flags=(--release); fi
            cargo test --locked "${profile_flags[@]}" \
              --test project_workflow --test typed_path_dependencies --test typed_package_lock --test typed_workspace --test typed_package --test native_incremental --test native_doctor \
              --test typed_native --test typed_process --test reproducible_native --test native_profiles \
              --test owned_enum_payloads --test owned_enum_payload_acceptance --test byte_record_fields --test bytebuf_binary --test hosted_execution --test byte_buffer_transfer --test byte_strings
            cargo test --locked "${profile_flags[@]}" \
              --test project_workflow --test typed_path_dependencies --test typed_package_lock --test typed_workspace --test typed_package --test native_incremental --test native_doctor \
              --test typed_fixed_arrays --test typed_division \
              --test typed_unary_negation --test typed_slices --test typed_projected_slices \
              --test typed_record_composition --test typed_hir_import --test reproducible_native --test native_profiles \
              --test owned_enum_payloads --test owned_enum_payload_acceptance --test byte_record_fields --test bytebuf_binary --test hosted_execution --test byte_buffer_transfer --test byte_strings -- --ignored
            cargo test --locked "${profile_flags[@]}" --bin oxid owned_enum -- --ignored
            OXID_OWNED_NATIVE_EVIDENCE="$RUNNER_TEMP/current-byte-storage-$profile" \
              cargo test --locked "${profile_flags[@]}" --bin oxid \
              byte_storage_native_source_free_ -- --ignored --test-threads=1
            OXID_OWNED_NATIVE_EVIDENCE="$RUNNER_TEMP/current-byte-fields-$profile" \
              cargo test --locked "${profile_flags[@]}" --bin oxid byte_record_ \
              -- --ignored --test-threads=1
            OXID_OWNED_NATIVE_EVIDENCE="$RUNNER_TEMP/current-byte-buffers-$profile" \
              cargo test --locked "${profile_flags[@]}" --bin oxid bytebuf_native_ \
              -- --ignored --test-threads=1
            cargo test --locked "${profile_flags[@]}" --bin oxid \
              frontend::driver::tests::prepared_reproducible_native_uses_retained_paths_and_bytes_after_source_removal \
              -- --ignored --exact
          done
      - name: Verify real package application and source-free deployment
        run: |
          python3 -B scripts/verify_typed_package_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-application" --native
          python3 -B scripts/verify_typed_package_lock.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-lock-application" --native
          python3 -B scripts/verify_typed_workspace_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-workspace-application" --native
          python3 -B scripts/verify_typed_package_bundle.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-package-bundle-application" --native
      - name: Verify relocatable native builds against raw executable bytes
        run: |
          python3 -B scripts/verify_reproducible_native.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-reproducible-native" --llvm-bin "$OXID_LLVM_BIN"
      - name: Verify optimized native builds, cache selection and deployment
        run: |
          python3 -B scripts/verify_native_profiles.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-native-profiles" --llvm-bin "$OXID_LLVM_BIN"
      - name: Verify enum payloads and byte fields in the frame filter application
        run: |
          python3 -B scripts/verify_owned_enum_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-owned-enum-application" --llvm-bin "$OXID_LLVM_BIN"
      - name: Verify growable buffers, binary I/O and source-free byte reversal
        run: |
          python3 -B scripts/verify_byte_reverse_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-byte-reverse-application" --llvm-bin "$OXID_LLVM_BIN"
      - name: Verify UTF-8 text, newline conversion and source-free Unicode processing
        run: |
          python3 -B scripts/verify_utf8_text_app.py target/debug/oxid target/release/oxid \
            --output "$RUNNER_TEMP/current-utf8-text-application" --llvm-bin "$OXID_LLVM_BIN"
      - name: Check buffer runtime components at O0 and O2 with memory checking
        run: |
          python3 -B scripts/test_bytebuf_runtime.py
          python3 -B scripts/test_binary_delivery.py
          python3 -B scripts/test_hosted_bytebuf.py
          python3 -B scripts/test_bytebuf_transfer.py
          OXID_BYTEBUF_SANITIZE=1 python3 -B scripts/test_bytebuf_runtime.py
          OXID_BYTEBUF_SANITIZE=1 python3 -B scripts/test_binary_delivery.py
          OXID_BYTEBUF_SANITIZE=1 python3 -B scripts/test_hosted_bytebuf.py
          OXID_BYTEBUF_SANITIZE=1 python3 -B scripts/test_bytebuf_transfer.py
      - name: Run current independent native oracles and private LLVM regressions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B scripts/verify_current_native.py --repo . \
            --output "$RUNNER_TEMP/current-native" --llvm-bin "$OXID_LLVM_BIN"
      - name: Retain current native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-native
          path: |
            ${{ runner.temp }}/current-native
            ${{ runner.temp }}/current-package-application
            ${{ runner.temp }}/current-package-lock-application
            ${{ runner.temp }}/current-workspace-application
            ${{ runner.temp }}/current-package-bundle-application
            ${{ runner.temp }}/current-reproducible-native
            ${{ runner.temp }}/current-native-profiles
            ${{ runner.temp }}/current-owned-enum-application
            ${{ runner.temp }}/current-byte-storage-debug
            ${{ runner.temp }}/current-byte-storage-release
            ${{ runner.temp }}/current-byte-fields-debug
            ${{ runner.temp }}/current-byte-fields-release
            ${{ runner.temp }}/current-byte-buffers-debug
            ${{ runner.temp }}/current-byte-buffers-release
            ${{ runner.temp }}/current-byte-reverse-application
            ${{ runner.temp }}/current-utf8-text-application
          if-no-files-found: warn
          retention-days: 14

  workflow-lint:
    name: Current workflow and metadata audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all workflow YAML
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate package metadata
        run: python3 -c "import json, tomllib; json.load(open('license-metadata.json')); tomllib.load(open('Cargo.toml','rb')); tomllib.load(open('oxid.toml','rb'))"
