name: Clean up superseded queued checks

on:
  push:
    branches: [KH/ci-queue-recovery]

permissions: {}

concurrency:
  group: oxid-ci-queue-maintenance
  cancel-in-progress: true

jobs:
  queued-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const expected = '8180b1bbcbcf9ccd4d648ff5ba0ec9ea3d5b971f';
            const integrationPR = 156;
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`.toLowerCase();
            if (repository !== 'yanagikh/oxid') {
              core.setFailed('Unexpected repository; no checks were cancelled.');
              return;
            }
            const current = await github.rest.pulls.get({ owner, repo, pull_number: integrationPR });
            if (current.data.head.sha !== expected) {
              core.setFailed('Integration head changed; no checks were cancelled.');
              return;
            }
            async function protectedHeads() {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              });
              const heads = new Set([expected]);
              for (const pull of pulls) {
                if (pull.head?.repo?.full_name?.toLowerCase() === repository &&
                    /^[0-9a-f]{40}$/.test(pull.head.sha || '')) heads.add(pull.head.sha);
              }
              return heads;
            }
            const currentHeads = await protectedHeads();
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: 'queued', event: 'pull_request', per_page: 100
            });
            let cancelled = 0;
            let unreadable = 0;
            for (const run of runs) {
              if (run.workflow_id !== 321632921 || run.event !== 'pull_request' ||
                  run.status !== 'queued' || currentHeads.has(run.head_sha) ||
                  run.head_repository?.full_name?.toLowerCase() !== `${owner}/${repo}`.toLowerCase() ||
                  !/^KH\//.test(run.head_branch || '') || !/^[0-9a-f]{40}$/.test(run.head_sha)) continue;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${run.head_sha}...${expected}`
                });
                if (comparison.data.status !== 'ahead') continue;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, filter: 'latest', per_page: 100
                });
                if (!jobs.length || jobs.some(job => job.runner_id || (job.status !== 'queued' &&
                    !(job.status === 'completed' && job.conclusion === 'skipped')))) continue;
                const fresh = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                if (fresh.data.status !== 'queued' || fresh.data.head_sha !== run.head_sha) continue;
                if ((await protectedHeads()).has(run.head_sha)) continue;
              } catch (error) {
                unreadable += 1;
                core.warning(`Skipped run ${run.id}: cannot verify its current state (HTTP ${error.status || 'unknown'}).`);
                continue;
              }
              const integration = await github.rest.pulls.get({ owner, repo, pull_number: integrationPR });
              if (integration.data.head.sha !== expected) {
                core.setFailed('Integration head changed; stopped queued-run cleanup.');
                return;
              }
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              core.info(`Cancelled superseded run ${run.id}; all reported jobs were unstarted or skipped.`);
              cancelled += 1;
            }
            core.info(`Cancelled ${cancelled} superseded queued runs; skipped ${unreadable} unreadable candidates. Current integration: ${expected}.`);
