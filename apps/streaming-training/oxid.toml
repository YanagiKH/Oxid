[project]
name = "streaming-training"
version = "0.1.0"
edition = "typed-preview"
entry = "src/main.ox"

[build]
profile = "release"
entry-mode = "process"
reproducible = true

[execution]
policy = "hosted"

[dependencies]
tensor = "../cpu-training/tensor"
reader = "reader"
checkpoint_files = "../cpu-training/checkpoint/storage"

[tests]
reader = "tests/reader.ox"
