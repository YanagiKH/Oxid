<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Create and run an Oxid project</title>
  <desc id="desc">Create hello, run the source, build a serialized AST artifact, then run the artifact. Both executions print Hello from Oxid.</desc>
  <rect width="1200" height="560" rx="28" fill="#0b1020"/>
  <rect x="32" y="32" width="1136" height="496" rx="20" fill="#11182d" stroke="#334268" stroke-width="2"/>
  <circle cx="72" cy="72" r="10" fill="#ff6b6b"/><circle cx="104" cy="72" r="10" fill="#ffd166"/><circle cx="136" cy="72" r="10" fill="#42d392"/>
  <text x="600" y="80" text-anchor="middle" fill="#91a4d2" font-family="monospace" font-size="22">Oxid 0.9 quickstart</text>
  <g font-family="monospace" font-size="27">
    <text x="70" y="145" fill="#61dafb">$</text><text x="105" y="145" fill="#f3f6ff">oxid new hello</text>
    <text x="70" y="195" fill="#61dafb">$</text><text x="105" y="195" fill="#f3f6ff">cd hello &amp;&amp; oxid run src/main.ox</text>
    <text x="105" y="240" fill="#42d392">Hello from Oxid</text>
    <text x="70" y="305" fill="#61dafb">$</text><text x="105" y="305" fill="#f3f6ff">oxid build</text>
    <text x="70" y="365" fill="#61dafb">$</text><text x="105" y="365" fill="#f3f6ff">oxid run .oxid/bin/hello.oxb</text>
    <text x="105" y="410" fill="#42d392">Hello from Oxid</text>
    <text x="105" y="480" fill="#91a4d2" font-size="21">Install Oxid first. The .oxb file runs on an Oxid interpreter.</text>
  </g>
</svg>
