<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Oxid 0.9 execution paths</title>
  <desc id="desc">The Rust frontend parses Oxid source. The interpreter runs the AST directly, or a Rust writer saves it as OXBC serialized AST for later interpretation. Native machine code is not generated.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ee7ff"/></marker></defs>
  <rect width="1200" height="640" rx="28" fill="#0b1020"/>
  <text x="600" y="64" text-anchor="middle" fill="#f5f7ff" font-family="sans-serif" font-size="34" font-weight="700">Oxid 0.9 execution paths</text>
  <g font-family="sans-serif" font-size="23" text-anchor="middle">
    <rect x="45" y="145" width="220" height="92" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="155" y="183" fill="#fff">.ox source</text><text x="155" y="213" fill="#93c5fd" font-size="18">program + imports</text>
    <rect x="340" y="145" width="220" height="92" rx="16" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/><text x="450" y="183" fill="#fff">Rust frontend</text><text x="450" y="213" fill="#a5f3fc" font-size="18">preprocess + parse</text>
    <rect x="635" y="145" width="220" height="92" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="745" y="183" fill="#fff">.oxb artifact</text><text x="745" y="213" fill="#86efac" font-size="18">serialized AST</text>
    <rect x="930" y="145" width="220" height="92" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="1040" y="183" fill="#fff">Interpreter</text><text x="1040" y="213" fill="#c4b5fd" font-size="18">execute the AST</text>
    <path d="M265 191H340M560 191H635M855 191H930" stroke="#6ee7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M450 237V305H1040V237" stroke="#6ee7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="745" y="286" fill="#a5f3fc" font-size="18">Direct source execution skips artifact storage</text>
    <rect x="150" y="370" width="360" height="110" rx="18" fill="#292524" stroke="#fbbf24" stroke-width="2"/><text x="330" y="413" fill="#fff">Oxid library modules</text><text x="330" y="446" fill="#fde68a" font-size="18">text, collections, HTTP, Discord</text>
    <rect x="690" y="370" width="360" height="110" rx="18" fill="#3b174f" stroke="#e879f9" stroke-width="2"/><text x="870" y="413" fill="#fff">Runtime services</text><text x="870" y="446" fill="#f5d0fe" font-size="18">files, processes, TCP, C/C++ helpers</text>
    <text x="600" y="554" fill="#aab8dc" font-size="21">Source and artifacts need the Oxid runtime. No native code is generated.</text>
    <text x="600" y="588" fill="#aab8dc" font-size="19">Release users do not need Rust; building the host from source does.</text>
  </g>
</svg>
