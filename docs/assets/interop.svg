<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Oxid language bridges</title>
  <desc id="desc">Oxid connects bidirectionally with Python, Java, Go, C, and C++.</desc>
  <rect width="1200" height="560" rx="28" fill="#0b1020"/>
  <text x="600" y="62" text-anchor="middle" fill="#f5f7ff" font-family="sans-serif" font-size="34" font-weight="700">One bridge command, five ecosystems</text>
  <g stroke="#6ee7ff" stroke-width="4" fill="none"><path d="M600 280L205 155"/><path d="M600 280L395 445"/><path d="M600 280L805 445"/><path d="M600 280L995 155"/><path d="M600 280L600 105"/></g>
  <circle cx="600" cy="280" r="112" fill="#172554" stroke="#60a5fa" stroke-width="4"/>
  <text x="600" y="270" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">Oxid</text><text x="600" y="310" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="20">process + generated SDKs</text>
  <g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="90" y="105" width="230" height="100" rx="18" fill="#1f2937" stroke="#facc15" stroke-width="2"/><text x="205" y="165" fill="#fde047">Python</text>
    <rect x="485" y="70" width="230" height="70" rx="18" fill="#1f2937" stroke="#fb923c" stroke-width="2"/><text x="600" y="115" fill="#fdba74">Java</text>
    <rect x="880" y="105" width="230" height="100" rx="18" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/><text x="995" y="165" fill="#93c5fd">Go</text>
    <rect x="280" y="395" width="230" height="100" rx="18" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/><text x="395" y="455" fill="#c4b5fd">C / ABI</text>
    <rect x="690" y="395" width="230" height="100" rx="18" fill="#1f2937" stroke="#f472b6" stroke-width="2"/><text x="805" y="455" fill="#f9a8d4">C++</text>
  </g>
</svg>
